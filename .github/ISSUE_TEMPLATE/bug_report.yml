name: Bug report
description: Report a bug in Lych
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug in Lych. Please fill in the details below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
      placeholder: "A clear and concise description of the bug."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this? Include the commands you ran.
      placeholder: |
        1. `./scripts/lych build`
        2. `./scripts/lych run`
        3. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Rust toolchain version, QEMU version, and the platform (e.g. QEMU virt/cortex-a72).
      placeholder: "e.g. Windows 11, rustc 1.x.y, QEMU 8.1, QEMU virt"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste the serial console output, panic messages, or GDB output here.
      render: text
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of the kernel does this affect?
      options:
        - Boot
        - Exceptions
        - Memory management
        - Drivers
        - Tooling / scripts
        - Build / CI
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have searched existing issues for a duplicate before opening this one
          required: true